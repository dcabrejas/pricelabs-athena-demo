# Harness Runtime environment spec: the Deep Agent, deployed as-is.
# Secrets come from .env.local (see README "Run it"). The repo is public, so no GITHUB_TOKEN.
name: athena-demo-endpoint
agent: langgraph
size: mars-2vcpu-4gb
idle_timeout: 10m

env:
  FRAMEWORK_REPO: "https://github.com/dcabrejas/pricelabs-athena-demo.git"
  FRAMEWORK_REPO_SHA: "${FRAMEWORK_REPO_SHA}"
  FRAMEWORK_SUBDIR: agent
  HARNESS_INFERENCE_MODEL: kimi-k3.1-pro          # DO Serverless Inference (open-weights)
  PRICING_API_URL: "https://pricing.134-209-209-90.sslip.io"
  AG_MCP_URL: "${AG_MCP_URL}"              # named Action Gateway endpoint, actor dcabrejas

secrets:
  HARNESS_INFERENCE_API_KEY: ${MODEL_ACCESS_KEY}
  PRICING_API_TOKEN: ${PRICING_API_TOKEN}
  AG_MCP_TOKEN: ${AG_MCP_TOKEN}            # DO token for the endpoint owner (dcabrejas)

# Action Gateway: a named endpoint owned by dcabrejas (not do.actions), so tool
# calls run as that actor and use its private listings-db connection. The agent
# connects to it from AG_MCP_URL (see pricing_agent/agent.py).

# Default-deny egress, plus the "Rails" app. Inference and Action Gateway stay
# reachable under any egress policy.
egress:
  - pricing.134-209-209-90.sslip.io
  - ${AG_MCP_HOST}
  - github.com
  - pypi.org
  - files.pythonhosted.org

permissions:
  default: allow
